<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats - To-Do App</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
    <nav>
    <a href="/">Home</a>
    <a href="/about.html">About</a>
    <a href="/stats.html">Stats</a>
    <button id="darkModeToggle" class="dark-toggle">🌙 Dark Mode</button>
    </nav>

    <h1>Task Stats</h1>
    <ul class="stats">
    <li>Total tasks: <span id="total">0</span></li>
    <li>Completed tasks: <span id="completed">0</span></li>
    <li>Upcoming tasks: <span id="upcoming">0</span></li>
    </ul>
</div>

<script>
    async function loadStats() {
    const res = await fetch("/api/stats");
    const data = await res.json();
    document.getElementById("total").textContent = data.total;
    document.getElementById("completed").textContent = data.completed;
    document.getElementById("upcoming").textContent = data.upcoming;
    }

    loadStats();

    // Restore dark mode
    if (localStorage.getItem("darkMode") === "enabled") {
    document.body.classList.add("dark");
    }

    const darkToggle = document.getElementById("darkModeToggle");
    if (darkToggle) {
    darkToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("darkMode", document.body.classList.contains("dark") ? "enabled" : "disabled");
    });
    }
</script>
</body>
</html>
