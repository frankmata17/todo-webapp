<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
</head>
<body>
<div class="app">
    <nav>
    <a href="/">Home</a>
    <a href="/about.html">About</a>
    <a href="/stats.html">Stats</a>
    <button id="darkModeToggle" class="dark-toggle">🌙 Dark Mode</button>
    </nav>

    <h1>My To-Do List</h1>

    <form id="task-form" class="input-section">
    <input type="text" id="task-input" placeholder="Enter a task" required>
    <input type="date" id="task-date">
    <button type="submit" id="addBtn">Add Task</button>
    </form>

    <div class="view-toggle">
    <button id="listViewBtn">List View</button>
    <button id="cardViewBtn">Card View</button>
    </div>

    <div id="taskContainer"></div>
</div>

<script src="script.js"></script>
</body>
</html>
